[project]
name = "deposit-forecasting"
version = "0.1.0"
description = "Comparing forecasting models for household overnight deposits on public ECB data"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "lightgbm>=4.7.0",
    "matplotlib>=3.11.2",
    "numpy>=1.26",
    "pandas>=2.2",
    "requests>=2.31",
    "shap>=0.54.1",
    "statsmodels>=0.14",
]

[project.scripts]
deposit-forecasting-data = "deposit_forecasting.data:main"
deposit-forecasting-backtest = "deposit_forecasting.backtest:main"
deposit-forecasting-scenarios = "deposit_forecasting.scenarios:main"
deposit-forecasting-explain = "deposit_forecasting.explain:main"
deposit-forecasting-figures = "deposit_forecasting.figures:main"

[dependency-groups]
dev = [
    "ipykernel>=6",
    "nbclient>=0.10",
    "nbformat>=5",
    "pytest>=8",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/deposit_forecasting"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
extend-exclude = ["notebooks"]
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
